<script>(function () {
  var url = location.href.split('#')[0];
  var tools = document.querySelector('.tools');
  var share = document.getElementById('share');
  var qr = document.getElementById('qr');
  var dlg = document.getElementById('qrd');
  var status = document.getElementById('status');
  var canShare = !!navigator.share;
  var canCopy = !!(navigator.clipboard && navigator.clipboard.writeText);
  var canDialog = typeof dlg.showModal === 'function';
  if (!canShare && !canCopy) share.hidden = true;
  if (!canDialog) qr.hidden = true;
  if (share.hidden && qr.hidden) return;
  tools.hidden = false;
  function say(text) {
    status.textContent = '';
    setTimeout(function () { status.textContent = text; }, 50);
    setTimeout(function () { status.textContent = ''; }, 3000);
  }
  share.addEventListener('click', function () {
    if (canShare) {
      navigator.share({ title: document.title, url: url }).catch(function () {});
    } else {
      navigator.clipboard.writeText(url).then(
        function () { say('Link copied to clipboard'); },
        function () { say('Could not copy the link'); }
      );
    }
  });
  qr.addEventListener('click', function () { dlg.showModal(); });
  document.getElementById('qrc').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
})();
</script>

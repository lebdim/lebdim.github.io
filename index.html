:root{--bg:#05070a;--fg:#e8f4ff;--mut:#8aa0b4;--a:#38bdf8;--b:#2563eb;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--fg)}
body{margin:0;min-height:100vh;font:600 16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;letter-spacing:.02em;

padding:max(28px,env(safe-area-inset-top)) 18px max(40px,env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto}

.av{width:112px;height:112px;margin:0 auto 14px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 38px rgba(56,189,248,.35),0 0 90px rgba(37,99,235,.25)}
.av img{display:block;width:100%;height:100%;border-radius:50%;background:#0b1118;border:3px solid var(--bg)}
h1{margin:2px 0 0;font-size:26px;letter-spacing:.02em}
.handle{color:var(--mut);font-weight:500}
.tag{margin:10px 0 0;font-weight:500}
.bio{margin:8px auto 0;max-width:420px;color:var(--mut);font-weight:400;font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.tools{display:flex;justify-content:center;gap:10px;margin:18px 0 6px}
button{font:inherit;font-size:14px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
button:hover{border-color:var(--a);box-shadow:0 0 18px rgba(56,189,248,.25)}
section{margin-top:22px}
h2{margin:0 0 10px 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.card{display:flex;align-items:center;gap:14px;padding:13px 14px;margin-bottom:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-1px);border-color:var(--a);box-shadow:0 0 22px rgba(56,189,248,.22);outline:none}
.ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.tx b{font-size:16px}
.tx i{font-style:normal;font-weight:400;font-size:13px;color:var(--fg);opacity:.8}
.tx small{font-weight:400;font-size:12px;color:var(--a);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;font-size:11px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
footer{margin-top:30px;text-align:center;color:var(--mut);font-weight:400;font-size:12px}
dialog{border:1px solid var(--line);border-radius:20px;background:#0b1118;color:var(--fg);padding:20px;text-align:center;max-width:320px}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog svg{width:220px;height:220px;border-radius:12px;display:block;margin:0 auto 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>(function () {
  var url = location.href.split('#')[0];
  var share = document.getElementById('share');
  var qr = document.getElementById('qr');
  var dlg = document.getElementById('qrd');
  share.addEventListener('click', function () {
    if (navigator.share) {
      navigator.share({ title: document.title, url: url }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () {
        share.textContent = 'Link copied';
        setTimeout(function () { share.textContent = 'Share'; }, 1800);
      });
    }
  });
  qr.addEventListener('click', function () { dlg.showModal(); });
  document.getElementById('qrc').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
})();
</script>
